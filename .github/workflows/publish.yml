# Publishes the site to Wix whenever main changes.
# Needs one repository secret, WIX_API_KEY: a Wix API key with access to the Know The Company site
# (Wix account → API Keys). Without it the run stops at the first step and nothing is published.
name: Publish to Wix

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "site.css"
      - "index.html"
      - "badge.html"
      - "auth-callback.html"
      - "logo.png"
      - "js/**"
      - "astro/**"
      - "test/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

concurrency:
  group: publish-to-wix
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the Wix API key is set
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "::error::Add a repository secret named WIX_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Test every page of the app
        working-directory: test
        run: |
          npm install --no-audit --no-fund
          npm test | tee test-output.txt
          grep -q "ERRORS: none" test-output.txt

      - name: Install
        working-directory: astro
        run: npm ci --no-audit --no-fund

      - name: Check the structured data
        working-directory: astro
        run: npm run check

      - name: Build
        working-directory: astro
        run: |
          # Public values only: the site's OAuth client id, and placeholders the hosting fills in at release.
          cat > .env.local <<'ENV'
          WIX_CLIENT_ID="5783d517-0173-420b-ba45-67e1d2efd460"
          WIX_CLOUD_PROVIDER="KUBERNETES"
          WIX_CLIENT_INSTANCE_ID="set-at-release"
          WIX_CLIENT_PUBLIC_KEY="set-at-release"
          WIX_CLIENT_SECRET="set-at-release"
          ENV
          npm run build

      - name: Publish to Wix
        working-directory: astro
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          npx wix login --api-key "$WIX_API_KEY"
          npx wix release --comment "$(git log -1 --format=%s | cut -c1-200)"
