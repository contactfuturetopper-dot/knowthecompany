<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Know The Company rating</title>
<style>
  :root{--navy:#1B2738;--slate:#364559;--lime:#ADE436;--ink:#0F172A;--muted:#5B6576;--line:#E3E7EE;--card:#fff;--star:#F5B301;--star-off:#D9DEE6}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  a.badge{display:flex;align-items:center;gap:12px;width:100%;max-width:300px;min-height:64px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(15,23,42,.06)}
  a.badge:hover{border-color:#C9D0DB}
  a.badge:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
  .mark{flex:none;width:30px;height:36px}
  .body{display:flex;flex-direction:column;gap:3px;min-width:0}
  .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .score{font-size:20px;font-weight:800;line-height:1}
  .stars{display:inline-flex;gap:1px}
  .meta{font-size:12px;color:var(--muted);line-height:1.3}
  .brand{font-size:12px;font-weight:700;color:var(--navy)}
  .brand b{color:#5E8A00}
  .ver{font-size:11px;font-weight:700;color:#2F5200;background:#EAF7CF;border-radius:999px;padding:2px 7px}
  .msg{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<a class="badge" id="badge" target="_blank" rel="noopener" href="./">
  <svg class="mark" viewBox="0 0 530 659" aria-hidden="true"><path d="M110 0H420A110 110 0 0 1 530 110V619A40 40 0 0 1 490 659H40A40 40 0 0 1 0 619V110A110 110 0 0 1 110 0Z" fill="#1B2738"/><rect x="86" y="100" width="146" height="124" rx="30" fill="#364559"/><rect x="298" y="100" width="145" height="124" rx="30" fill="#364559"/><rect x="86" y="278" width="146" height="124" rx="30" fill="#364559"/><rect x="298" y="278" width="145" height="124" rx="30" fill="#ADE436"/><path d="M361 400H397L379.5 428Z" fill="#ADE436"/><rect x="86" y="459" width="146" height="124" rx="30" fill="#364559"/><rect x="298" y="459" width="145" height="124" rx="30" fill="#364559"/></svg>
  <span class="body" id="body"><span class="msg">Loading rating…</span></span>
</a>
<script type="module">
/* Embeddable rating badge: badge.html?c=<company website id>&t=customer|employee
   It reads the company and its published reviews straight from the Wix CMS, so the rating is always the
   live one. Nothing here can be set by the company: the numbers are counted from published reviews. */
import { getItemById, queryItems } from "/js/wix/items.js";

const q = new URLSearchParams(location.search);
const wid = (q.get('c') || '').trim().toLowerCase();
const type = q.get('t') === 'employee' ? 'employee' : 'customer';
const el = document.getElementById('body'), link = document.getElementById('badge');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slug = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const star = (fill, k) => `<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="g${k}"><stop offset="${fill * 100}%" stop-color="#F5B301"/><stop offset="${fill * 100}%" stop-color="#D9DEE6"/></linearGradient></defs><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z" fill="url(#g${k})"/></svg>`;
const stars = avg => `<span class="stars" aria-hidden="true">${[0, 1, 2, 3, 4].map(i => star(Math.max(0, Math.min(1, avg - i)), i)).join('')}</span>`;
const brand = '<span class="brand">Know<b>The</b>Company</span>';
const site = new URL('./', location.href).href;

async function run() {
  if (!wid) { el.innerHTML = `<span class="msg">Rating unavailable</span>${brand}`; link.href = site; return; }
  const co = await getItemById('Companies', wid);
  if (!co) { el.innerHTML = `<span class="msg">Rating unavailable</span>${brand}`; link.href = site; return; }
  const name = co.title || wid;
  link.href = site + '#co-' + (co.slug || slug(name));
  link.setAttribute('aria-label', `${name} reviews on Know The Company`);
  const items = [];
  for (let skip = 0, i = 0; i < 10; i++) {
    const page = await queryItems('Reviews', { filters: [{ field: 'company', op: 'eq', value: wid }], limit: 1000, skip });
    items.push(...page.items);
    if (!page.hasNext || !page.items.length) break;
    skip += page.items.length;
  }
  const list = items.filter(r => (r.type || 'customer') === type && Number(r.rating) > 0);
  const verified = co.claimStatus === 'verified' ? '<span class="ver">Verified</span>' : '';
  if (!list.length) {
    el.innerHTML = `<span class="row"><span class="msg">No ${type} reviews yet</span>${verified}</span><span class="meta">Be the first to review ${esc(name)} on ${brand}</span>`;
    return;
  }
  const avg = list.reduce((s, r) => s + Number(r.rating), 0) / list.length;
  const n = list.length, label = type === 'employee' ? 'employee' : 'customer';
  el.innerHTML = `<span class="row"><span class="score">${avg.toFixed(1)}</span>${stars(avg)}${verified}</span>
    <span class="meta">${n} ${label} review${n === 1 ? '' : 's'} on ${brand}</span>`;
  link.title = `${name}: ${avg.toFixed(1)} out of 5 from ${n} ${label} review${n === 1 ? '' : 's'}`;
}
run().catch(() => { el.innerHTML = `<span class="msg">Rating unavailable right now</span>${brand}`; link.href = site; });
</script>
</body>
</html>
